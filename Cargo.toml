[package]
name = "html-minifier"
version = "6.0.0"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/magiclen/html-minifier"
homepage = "https://magiclen.org/html-minifier"
keywords = ["html", "minify", "script", "style"]
categories = ["encoding"]
description = "This library minifies streaming HTML, including embedded JavaScript and CSS, while preserving pre and textarea content."
license = "MIT"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
html-escape = "0.3.0"

[dependencies.educe]
version = "0.8.1"
features = ["Debug", "Default"]
default-features = false
